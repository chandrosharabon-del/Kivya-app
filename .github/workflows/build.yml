name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/python-versions@v2
      with:
        python-version: '3.10'

    - name: Build with Buildozer Action
      uses: ArtemSydoryk/buildozer-action@v1.2.0
      with:
        command: buildozer -v android debug
        subpath: '.'

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: app-release
        path: bin/*.apk
